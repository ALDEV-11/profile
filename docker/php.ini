; Production overrides for the Vercel container.
; Keep upload limits above the application's 4 MB image limit.
upload_max_filesize = 8M
post_max_size = 16M
memory_limit = 256M
max_execution_time = 60
max_input_time = 60

expose_php = Off
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
